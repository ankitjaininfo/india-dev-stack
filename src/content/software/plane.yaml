Name: "Plane"
Tagline: "Open-source project management for teams and AI agents"
Description: "Plane is an open-source project and knowledge management platform that brings work items, cycles, roadmaps, documentation, and AI-powered workflows into one workspace. Teams can use Plane Cloud or deploy it on their own infrastructure, including air-gapped environments, as a modern alternative to Jira, Linear, ClickUp, Asana, and Monday.com."
Website: "https://plane.so"
Features:
  - "Projects, work items, epics, initiatives, cycles, and releases in one workspace"
  - "List, board, calendar, Gantt, and spreadsheet layouts with saved views"
  - "Built-in Wiki and project pages that keep documentation connected to work"
  - "Plane AI for workspace-wide answers, triage, summaries, and agent assignments"
  - "Cloud, self-hosted, and air-gapped deployment options"
  - "REST API, webhooks, OAuth apps, SDKs, and a native MCP server"
  - "Importers and integrations for Jira, Linear, GitHub, GitLab, Slack, and more"
