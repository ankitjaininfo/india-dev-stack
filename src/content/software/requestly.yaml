Name: "Requestly"
Tagline: "Design, build, test, and debug APIs in one place"
Description: "Requestly is an open-source, developer-first API client and HTTP interception platform. It helps developers build and test APIs, intercept and modify network traffic, mock responses, debug web applications, and collaborate through local, Git-backed, team, or self-hosted workspaces. Available as a desktop app and browser extension, it is used by more than 300,000 developers."
Website: "https://requestly.com"
Features:
  - "Git-native API client with local collections, environments, variables, and request history."
  - "Intercept and modify HTTP requests, responses, headers, query parameters, and request bodies."
  - "Mock APIs, errors, delays, and edge cases without waiting for backend services."
  - "Run REST, GraphQL, and scripted API tests with pre-request and post-response JavaScript."
  - "Import collections from Postman, Insomnia, cURL, and OpenAPI."
  - "Collaborate using team workspaces, one-click sharing, Git sync, or self-hosting."
  - "Works across macOS, Windows, Linux, Chrome, Edge, Firefox, and Safari."
