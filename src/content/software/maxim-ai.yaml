Name: "Bifrost by Maxim AI"
Tagline: "Open-Source Enterprise AI Gateway"
Description: "Bifrost is Maxim AI's open-source gateway and governance platform for production AI. It gives teams one interface for more than 1,000 models, with high-performance routing, provider failover, budget controls, observability, guardrails, MCP tooling, and enterprise access policies. It also integrates with Maxim's evaluation stack for tracing, simulation, and continuous quality monitoring."
Website: "https://www.getmaxim.ai"
Features:
  - "Unified OpenAI-compatible API for more than 1,000 models across multiple providers"
  - "High-performance routing with automatic fallbacks and adaptive load balancing"
  - "Budgets, rate limits, virtual keys, SSO, RBAC, and immutable audit logs"
  - "Built-in OpenTelemetry observability for requests, traces, costs, and provider health"
  - "MCP gateway with tool governance, authentication, filtering, and code mode"
  - "Real-time guardrails, semantic caching, VPC deployment, and Maxim evaluation integration"
